# This is a basic workflow to help you get started with Actions

name: Test Build Action

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  # push:
  #   branches: [ "pharo12" ]
  # pull_request:
  #   branches: [ "pharo12" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v4
        with: # Iceberg requires the full commit history https://github.com/marketplace/actions/setup-smalltalkci
          fetch-depth: 0 
      # https://github.com/marketplace/actions/setup-smalltalkci
      - uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: 'Pharo64-12'

      # https://github.com/marketplace/actions/setup-chrome
      - uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
    
      # https://github.com/marketplace/actions/setup-node-js-environment
      - uses: actions/setup-node@v4
        with:
          node-version: 'latest' 
          # cache: 'npm'
          # cache-dependency-path: '**/package-lock.json'

      # Run tests headless
      # https://github.com/marketplace/actions/setup-xvfb
      - uses: coactions/setup-xvfb@v1
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }}
          shell: bash
          timeout-minutes: 15


        
