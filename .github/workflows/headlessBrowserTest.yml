name: Headless Browser Environment
on: 
    # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
     - name: Setup Headless Display
       uses: pyvista/setup-headless-display-action@v3
   
     - name: Setup Chrome
       uses: browser-actions/setup-chrome@v1

     - name: Test xdg-open
        run: |
          if xdg-open https://example.com; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed (expected in headless environment)"
          fi
