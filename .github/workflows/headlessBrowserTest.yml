name: Headless Browser Environment
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create Chrome headless wrapper
      run: |
        mkdir -p ~/bin
        # Create a wrapper script that forces headless mode
        echo '#!/bin/bash' > ~/bin/google-chrome
        echo '/usr/bin/google-chrome --headless --disable-gpu --no-sandbox "$@"' >> ~/bin/google-chrome
        chmod +x ~/bin/google-chrome
        # Add wrapper directory to PATH
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Test browser wrapper
      run: |
        # Test the wrapper by dumping the DOM from a webpage
        google-chrome --dump-dom https://example.com > output.html
  
        # Verify the page loaded correctly
        if grep -q "<title>Example Domain</title>" output.html; then
          echo "✅ Successfully loaded page"
          echo "Page title found: $(grep -o '<title>[^<]*</title>' output.html)"
        else
          echo "❌ Failed to properly load page"
          exit 1
        fi
