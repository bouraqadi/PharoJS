name: Headless Browser Environment
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run the Application with Headless Display
        env:
          DISPLAY: :99
        run: |
          # Start Xvfb on display :99 with a screen resolution of 1024x768 and 24-bit color depth
          Xvfb :99 -screen 0 1024x768x24 &
          # Allow Xvfb some time to start
          sleep 3
          
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
         
      - name: Test browser wrapper
        run: |
          # Test the wrapper by dumping the DOM from a webpage
          google-chrome --dump-dom https://example.com > output.html
    
          # Verify the page loaded correctly
          if grep -q "<title>Example Domain</title>" output.html; then
            echo "✅ Successfully loaded page"
            echo "Page title found: $(grep -o '<title>[^<]*</title>' output.html)"
          else
            echo "❌ Failed to properly load page"
            exit 1
          fi
