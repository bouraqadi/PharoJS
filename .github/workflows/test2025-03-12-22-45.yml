name: Test 25-03-12 22:45

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
  # This workflow contains a single job called "build"
    runs-on: ubuntu-latest
    steps:
      # From https://github.com/browser-actions
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      # Install necessary dependencies for headless Firefox
      - name: Install dependencies
        run: |
          sudo apt-get update
           sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libegl1 libxcb-dri3-0 libxcb-xtest0 mesa-utils
          
      # Start Xvfb on display :99
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset  > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 3  # Wait for Xvfb to start before proceeding

      - name: Create headless browser script
        run: |
          sudo tee /usr/local/bin/webBrowserHeadless > /dev/null << 'EOF'
          #!/bin/sh
          export MOZ_HEADLESS=1
          export MOZ_DISABLE_GMP_SANDBOX=1 
          export MOZ_DISABLE_GPU_SANDBOX=1
          export MOZ_DISABLE_CONTENT_SANDBOX=1
          export MOZ_DISABLE_RDD_SANDBOX=1
          export MOZ_WEBRENDER=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export MOZ_X11_EGL=0
          export DISPLAY=:99  # Match the Xvfb display
          firefox --headless --disable-gpu --disable-software-rasterizer --no-remote --marionette "${@}"
          EOF

          sudo chmod +x /usr/local/bin/webBrowserHeadless

      - name: Verify script creation
        run: |
          ls -l /usr/local/bin/webBrowserHeadless
          cat /usr/local/bin/webBrowserHeadless
          /usr/local/bin/webBrowserHeadless https://example.com

      - name: Setup default browser
        run: |
          sudo update-alternatives --install /usr/bin/www-browser www-browser /usr/local/bin/webBrowserHeadless 100
          sudo update-alternatives --set www-browser /usr/local/bin/webBrowserHeadless
          ls -l /etc/alternatives | grep browser

      - name: Test opening some URL
        run: |
          if xdg-open https://example.com; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed"
            exit 1
          fi
