name: Create and Run JS Script

on:
  workflow_dispatch:

jobs:
  create-and-run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create JavaScript script
      run: |
        cat > display_arg.js << 'EOF'
        #!/usr/bin/env node
        
        const arg = process.argv[2];
        
        if (!arg) {
          console.log('No argument provided');
          process.exit(1);
        }
        
        console.log(`First argument: ${arg}`);
        EOF
        
        chmod +x display_arg.js
    
    - name: Run script - First execution
      run: node display_arg.js "Hello from first run"
    
    - name: Run script - Second execution
      run: node display_arg.js "Hello from second run"
