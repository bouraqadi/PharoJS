name: Default Browser with Puppeteer 

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      
        # Manual install
        # run: |
        #   wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        #   echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        #   sudo apt-get update
        #   sudo apt-get install -y google-chrome-stable curl

      - name: Install Puppeteer
        run: |
          npm install puppeteer

      - name: Create headless browser script
        run: |
          sudo tee ${GITHUB_WORKSPACE}/webBrowserHeadless > /dev/null << 'EOF'
          #!/usr/bin/env node
          const puppeteer = require('puppeteer');

          (async () => {
            const url = process.argv[2];
            if (!url) {
              console.error('Usage: ./openUrl <URL>');
              console.error('Example: ./openUrl https://www.google.com');
              process.exit(1); 
            }
            console.log('Got URL ${url}');
            let browser; 
            try {
              // Launch a new browser instance.
              // Set headless: false if you want to see the browser UI.
              browser = await puppeteer.launch({args: ['--no-sandbox']}); // {args: ['--headless=new', '--disable-gpu', '--no-sandbox', '--disable-dev-shm-usage'] }
              console.log('Browser launched successfully!');

              // Create a new page (tab)
              const page = await browser.newPage();
              console.log('New page created.');

              console.log(`Ready to open the web browser on ${url}`);
              // Navigate to the provided URL
              await page.goto(url, { waitUntil: 'networkidle0' });
              console.log('Page loaded successfully!');

              // Get and print the page title
              const pageTitle = await page.title();
              console.log(`Opened title: "${pageTitle}"`);
                } catch (error) {
              console.error('An error occurred:', error);
              if (browser) {
                  await browser.close();
                  console.log('Browser closed.');
                }
            }finally{
              if (browser) {
                  await browser.close();
                  console.log('Browser closed.');
                }            
            }
          })();
          EOF
  
          sudo chmod +x ${GITHUB_WORKSPACE}/webBrowserHeadless
          ln -s ${GITHUB_WORKSPACE}/webBrowserHeadless /usr/local/bin/webBrowserHeadless
          
      - name: Verify webBrowserHeadless script works as expected
        run: |
          ls -l /usr/local/bin/webBrowserHeadless
          cat /usr/local/bin/webBrowserHeadless
          if webBrowserHeadless https://example.com | grep -q "<title>Example Domain</title>" ; then
            echo "✅ webBrowserHeadless executed successfully"
          else
            echo "❌ webBrowserHeadless failed"
            exit 1
          fi
          
      - name: Setup default browser
        run: |
          sudo update-alternatives --install /usr/bin/www-browser www-browser /usr/local/bin/webBrowserHeadless 100
          sudo update-alternatives --set www-browser /usr/local/bin/webBrowserHeadless
          ls -l /etc/alternatives | grep browser

      - name: Test opening some URL with default browser (xdg-open)
        run: |
          if xdg-open https://example.com | grep -q "<title>Example Domain</title>" ; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed"
            exit 1
          fi
    
