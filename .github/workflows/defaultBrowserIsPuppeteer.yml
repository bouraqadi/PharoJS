name: Create and Run Puppeteer Script

on:
  workflow_dispatch:

jobs:
  create-and-run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Puppeteer
      run: npm install puppeteer
    
    - name: Create Puppeteer script
      run: |
        cat > webBrowserHeadless << 'EOF'
        #!/usr/bin/env node
        
        const puppeteer = require('puppeteer');
        
        const url = process.argv[2];
        
        if (!url) {
          console.log('No URL provided');
          console.log('Usage: node browser_opener.js <url>');
          console.log('Example: node browser_opener.js https://github.com');
          process.exit(1);
        }
        
        (async () => {
          try {
            console.log(`Opening browser and navigating to: ${url}`);
            
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            await page.goto(url, { waitUntil: 'networkidle2' });
            
            const title = await page.title();
            const currentUrl = page.url();
            
            console.log(`Successfully loaded page:`);
            console.log(`  Title: ${title}`);
            console.log(`  URL: ${currentUrl}`);
            
            await browser.close();
            console.log('Browser closed successfully');
            
          } catch (error) {
            console.error('Error:', error.message);
            process.exit(1);
          }
        })();
        EOF
        
        chmod +x webBrowserHeadless
        echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH
    
    - name: Run script - First execution
      run: webBrowserHeadless "https://github.com"
    
    - name: Run script - Second execution
      run: webBrowserHeadless "https://www.google.com"
