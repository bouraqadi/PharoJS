# This is a basic workflow to help you get started with Actions

name: Test 00

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:

      # From https://github.com/browser-actions
      # - name: Setup Firefox
      #   uses: browser-actions/setup-firefox@v1
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Create headless browser script
        run: |
          sudo tee /usr/local/bin/chromeHeadless > /dev/null << 'EOF'
          #!/bin/sh
          export DISPLAY=:99
          export DBUS_SESSION_BUS_ADDRESS=/dev/null
          google-chrome --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --disable-software-rasterizer --disable-dbus --mute-audio "${@}"
          EOF
  
          sudo chmod +x /usr/local/bin/chromeHeadless
          
      - name: Verify script creation
        run: |
          ls -l /usr/local/bin/chromeHeadless
          cat /usr/local/bin/chromeHeadless
          /usr/local/bin/chromeHeadless https://example.com
          
      - name: Setup default browser
        run: |
          sudo update-alternatives --install /usr/bin/www-browser www-browser /usr/local/bin/chromeHeadless 100
          sudo update-alternatives --set www-browser /usr/local/bin/chromeHeadless
          ls -l /etc/alternatives | grep browser

      - name: Test openning some URL
        run: |
          if xdg-open https://example.com; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed"
          fi
        
