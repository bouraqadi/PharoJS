# This is a basic workflow to help you get started with Actions

name: Test 00

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/pyvista/setup-headless-display-action
      - name: Setup Headless Display
        uses: pyvista/setup-headless-display-action@v3

      # From https://github.com/browser-actions
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1
       
      - name: test xdg open url
        run: |
          if xdg-open https://example.com; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed (expected in headless environment)"
            exit 1
          fi

      
