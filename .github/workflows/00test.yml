f# This is a basic workflow to help you get started with Actions

name: Test 00

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:

      # From https://github.com/browser-actions
      # - name: Setup Firefox
      #   uses: browser-actions/setup-firefox@v1
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # https://github.com/marketplace/actions/setup-xvfb 
      # - name: Install Xvfb
      #  run: |
      #    sudo apt-get update
      #    sudo apt-get install -y xvfb
      # From 
      # - name: Run headless test
      #  run:  xvfb-run --auto-servernum "-screen 0 1024x768x24" xdg-open https://example.com

      - name: Create headless browser script
        run: |
          echo "#!/bin/bashrc \necho ${@}" > ~/chromeHeadless
          chmod u+x ${HOME}/chromeHeadless

      - name: Test running script
        run: ${HOME}/chromeHeadless https://example.com
          
      # - name: Setup default browser
      #   run: |
      #     sudo update-alternatives --install /usr/bin/www-browser www-browser ${HOME}/chromeHeadless 100
      #     sudo update-alternatives --set www-browser ~/chromeHeadless
      - name: Setup default browser
        run: |
          sudo update-alternatives --install /usr/bin/www-browser www-browser ${HOME}/chromeHeadless 100
          sudo update-alternatives --set www-browser ${HOME}/chromeHeadless
          ls -l /etc/alternatives | grep browser

      - name: Test openning some URL
        run: |
          if xdg-open https://example.com; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed (expected in headless environment)"
          fi
        
