# This is a basic workflow to help you get started with Actions

name: Test 00

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:

      # From https://github.com/browser-actions
      # - name: Setup Firefox
      #   uses: browser-actions/setup-firefox@v1
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # https://github.com/marketplace/actions/setup-xvfb 
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # From https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v4

      # From https://github.com/GabrielBB/xvfb-action
      - name: Run headless test
        uses: GabrielBB/xvfb-action@v1
        with:
          run: |
            if xdg-open https://example.com; then
              echo "✅ xdg-open executed successfully"
            else
              echo "❌ xdg-open failed (expected in headless environment)"
              exit 1
            fi

      
