# This is a basic workflow to help you get started with Actions

name: Test 00

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:

           
      # From https://github.com/browser-actions
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1

      # https://github.com/marketplace/actions/setup-xvfb 
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: test xdg open url with Headless Display
        env:
          DISPLAY: :99
        run: |
          # Start Xvfb on display :99 with a screen resolution of 1024x768 and 24-bit color depth
          Xvfb :99 -screen 0 1024x768x24 &
          # Allow Xvfb some time to start
          sleep 3
          if xdg-open https://example.com; then
            echo "✅ xdg-open executed successfully"
          else
            echo "❌ xdg-open failed (expected in headless environment)"
            exit 1
          fi

      
